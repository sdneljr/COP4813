<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damped Sine Wave Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Damped Sine Wave Calculator</h1>

        <p>
            This calculator plots the equation:
            y = A × e<sup>-bx</sup> × sin(ωx)
        </p>

        <div class="calculator">

            <label for="amplitude">Amplitude (A):</label>
            <input type="number" id="amplitude" value="10" step="0.1">

            <label for="damping">Damping (b):</label>
            <input type="number" id="damping" value="0.1" step="0.01">

            <label for="frequency">Frequency (ω):</label>
            <input type="number" id="frequency" value="2" step="0.1">

            <label for="xmin">Minimum X:</label>
            <input type="number" id="xmin" value="0">

            <label for="xmax">Maximum X:</label>
            <input type="number" id="xmax" value="20">

            <button id="calculateButton">Calculate and Plot</button>

        </div>

        <h2>Results</h2>

        <div id="results"></div>

        <canvas id="waveChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
