<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="COP4813 Assignment 3 contact and information form.">
    <title>Assignment 3 Form | Sean's IT Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Assignment 3 - Information Form</h1>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="assignments.html">Assignments</a>
    </nav>

    <main>

        <form id="userForm">

            <h2>Personal Information</h2>

            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required>

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required>

            <label for="address">Street Address</label>
            <input type="text" id="address" name="address" required>

            <label for="city">City</label>
            <input type="text" id="city" name="city" required>

            <label for="state">State</label>
            <input type="text" id="state" name="state" maxlength="2" required>

            <label for="zip">ZIP Code</label>
            <input type="text" id="zip" name="zip" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="(000)000-0000" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="birthdate">Birth Date</label>
            <input type="date" id="birthdate" name="birthdate" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <label for="confirm">Security Question: What is 5 + 3?</label>
            <input type="text" id="confirm" name="confirm" required>

            <button type="submit">Submit Form</button>

        </form>

    </main>

    <script src="form.js"></script>

</body>
</html>
